<!--
╔══════════════════════════════════════════════════════════════════╗
║  КАК РЕДАКТИРОВАТЬ                                               ║
║  Всё, что нужно менять, находится в блоке скриптов ниже:         ║
║    1) PROFILE — вы: имя, должность, «обо мне», контакты, услуги  ║
║    2) CASES   — ваши кейсы (можно добавлять, удалять, менять     ║
║                 порядок: каждый кейс — один блок { ... })        ║
║  Если поле оставить пустым "" — этот элемент на сайте скроется.  ║
║  Верстку и стили трогать не нужно.                               ║
╚══════════════════════════════════════════════════════════════════╝
-->

<style>
:root{
  --bg:#f6f2ec; --bg2:#ece6dc; --card:#fffdf9; --ink:#1b1713; --mute:#6f665b; --line:#ddd4c6;
  --accent:#b4532a; --accent-ink:#fff; --shadow:0 24px 60px -24px rgba(40,25,10,.35);
  --r:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15120f; --bg2:#1c1814; --card:#211c17; --ink:#f3ede4; --mute:#a99f92; --line:#3a322a;
    --accent:#e08a5b; --accent-ink:#1d1007; --shadow:0 24px 60px -24px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#15120f; --bg2:#1c1814; --card:#211c17; --ink:#f3ede4; --mute:#a99f92; --line:#3a322a;
  --accent:#e08a5b; --accent-ink:#1d1007; --shadow:0 24px 60px -24px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 20px}
section{padding:84px 0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:14px}
h2{font-size:clamp(32px,5vw,48px);margin-bottom:14px}
.lead{color:var(--mute);max-width:640px;font-size:17px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font:600 15px Manrope,sans-serif;border:1px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px var(--accent)}
.btn-line{border-color:var(--line);color:var(--ink);background:transparent}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:10px 18px;font-size:13px}

/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:Fraunces,serif;font-size:22px;font-weight:600}
.logo i{color:var(--accent);font-style:normal}
nav ul{display:flex;gap:26px;list-style:none;font-size:14px;color:var(--mute);font-weight:500}
nav a:hover{color:var(--accent)}
.nav-r{display:flex;gap:10px;align-items:center}
.theme{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.theme:hover{border-color:var(--accent)}
.theme:focus-visible{outline:2px solid var(--accent)}
@media(max-width:860px){nav ul{display:none}}

/* hero */
.hero{padding:84px 0 56px}
.hero h1{font-size:clamp(42px,7.4vw,86px);max-width:15ch;margin-bottom:22px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .sub{font-size:clamp(17px,2vw,20px);color:var(--mute);max-width:600px;margin-bottom:30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.stat b{display:block;font:600 36px Fraunces,serif;line-height:1}
.stat span{font-size:13px;color:var(--mute)}

/* cases */
.case{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center;padding:52px 0;border-top:1px solid var(--line)}
.case:first-of-type{margin-top:34px}
.case:nth-of-type(even) .c-info{order:2}
.c-num{font:italic 500 18px Fraunces,serif;color:var(--accent);margin-bottom:8px}
.case h3{font-size:clamp(28px,3.6vw,40px);margin-bottom:6px}
.c-meta{color:var(--mute);font-size:14px;margin-bottom:16px}
.c-desc{color:var(--mute);margin-bottom:18px}
.c-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tag{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--mute)}
.c-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.c-col h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:700}
.c-col ul{list-style:none;display:grid;gap:7px;font-size:14px}
.c-col li{padding-left:16px;position:relative}
.c-col li:before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.c-links{display:flex;gap:10px;flex-wrap:wrap}

.shots{position:relative;padding-bottom:36px}
.browser{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.bar span{margin-left:10px;flex:1;font-size:12px;color:var(--mute);background:var(--bg);border-radius:6px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser button,.phone button,.thumbs button{all:unset;cursor:zoom-in;display:block;width:100%}
.browser button:focus-visible,.phone button:focus-visible,.thumbs button:focus-visible{outline:2px solid var(--accent)}
.browser img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.phone{position:absolute;right:-8px;bottom:0;width:27%;min-width:104px;background:#0c0a08;border:5px solid #0c0a08;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.phone img{width:100%;aspect-ratio:390/844;object-fit:cover;object-position:top;border-radius:18px}
.thumbs{display:flex;gap:10px;margin-top:14px;padding-right:30%}
.thumbs button{border-radius:10px;overflow:hidden;border:1px solid var(--line);flex:1}
.thumbs img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
@media(max-width:900px){
  .case{grid-template-columns:1fr;gap:28px}
  .case:nth-of-type(even) .c-info{order:0}
  .phone{right:6px}
}
@media(max-width:520px){.c-cols{grid-template-columns:1fr}}

/* services */
.band{background:var(--bg2);border-block:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.card .ic{font-size:26px;margin-bottom:12px}
.card h3{font-size:22px;margin-bottom:8px}
.card p{color:var(--mute);font-size:15px}
.card .price{margin-top:14px;font-weight:700;color:var(--accent);font-size:15px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px;counter-reset:s}
.step{border-top:2px solid var(--ink);padding-top:16px;counter-increment:s}
.step:before{content:counter(s,decimal-leading-zero);font:italic 500 18px Fraunces,serif;color:var(--accent);display:block;margin-bottom:8px}
.step h3{font-size:20px;margin-bottom:6px}
.step p{color:var(--mute);font-size:14px}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* about */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px;align-items:center}
.photo{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,var(--bg2),var(--card));display:grid;place-items:center;box-shadow:var(--shadow)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ini{font:italic 500 96px Fraunces,serif;color:var(--accent)}
.about p{color:var(--mute);margin-bottom:14px;font-size:16px}
.skills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media(max-width:860px){.about{grid-template-columns:1fr}.photo{max-width:340px}}

/* contacts */
.contact{text-align:center}
.contact .lead{margin:0 auto 28px}
.contact .cta{justify-content:center}
.clist{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:30px;color:var(--mute);font-size:15px}
.clist a:hover{color:var(--accent)}
footer{padding:30px 0;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,8,6,.93);display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb button{position:absolute;background:rgba(30,25,20,.9);border:1px solid #4a4036;color:#f3ede4;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .x{top:16px;right:16px}.lb .p{left:14px;top:50%}.lb .n{right:14px;top:50%}
.lb button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>

  <section class="band" id="about">

      <div class="cta" id="c-cta"></div>
      <div class="clist" id="c-list"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="f-left"></span>
    <span id="f-right"></span>
  </div>
</footer>

/* ═══════════════════════════════════════════════════════════════
   Ниже — код сайта. Менять не нужно.

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function src(v){return (typeof IMGS!=="undefined"&&IMGS[v])||v}
function tg(u){return "https://t.me/"+String(u).replace(/^@/,"")}
function wa(n){return "https://wa.me/"+String(n).replace(/\D/g,"")}
function accent(s){return esc(s).replace(/\*(.+?)\*/g,"<em>$1</em>")}
function show(id,on){$(id).hidden=!on}

var P=PROFILE;
document.title=P.name+" — портфолио";
$("logo").innerHTML=esc(P.name)+"<i>.</i>";

/* nav */
var nav=[["cases","Кейсы"],["services","Услуги"],["process","Процесс"],["about","Обо мне"],["contact","Контакты"]];
$("navlinks").innerHTML=nav.map(function(n){return '<li><a href="#'+n[0]+'">'+n[1]+'</a></li>'}).join("");

/* hero */
$("h-eyebrow").textContent=P.role; show("h-eyebrow",!!P.role);
$("h-title").innerHTML=accent(P.headline);
$("h-sub").textContent=P.subline; show("h-sub",!!P.subline);
function contactButtons(withLine){
  var h="";
  if(P.telegram)h+='<a class="btn btn-main" href="'+tg(P.telegram)+'" target="_blank" rel="noopener noreferrer">Написать в Telegram</a>';
  if(P.whatsapp)h+='<a class="btn '+(h?'btn-line':'btn-main')+'" href="'+wa(P.whatsapp)+'" target="_blank" rel="noopener noreferrer">WhatsApp</a>';
  if(P.max)h+='<button type="button" class="btn btn-line" data-max="'+esc(P.max)+'">MAX</button>';
  if(!h&&P.phone)h+='<a class="btn btn-main" href="tel:'+esc(P.phone.replace(/[^\d+]/g,""))+'">Позвонить</a>';
  if(!h&&P.email)h+='<a class="btn btn-main" href="mailto:'+esc(P.email)+'">Написать на почту</a>';
  return h;
}
$("h-cta").innerHTML=contactButtons()+'<a class="btn btn-line" href="#cases">Смотреть кейсы</a>';
$("h-stats").innerHTML=(P.stats||[]).map(function(s){return '<div class="stat"><b>'+esc(s.value)+'</b><span>'+esc(s.label)+'</span></div>'}).join("");
show("h-stats",(P.stats||[]).length>0);
if(P.telegram)$("navcta").href=tg(P.telegram);

/* cases */
$("cases-title").textContent=P.casesTitle; $("cases-lead").textContent=P.casesLead;
var gallery=[]; // для lightbox: массив массивов url
function list(arr){return (arr||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join("")}
$("cases-list").innerHTML=CASES.map(function(c,i){
  var all=[c.cover].concat(c.more||[]).filter(Boolean).map(src);
  gallery[i]=all;
  var num=(i+1<10?"0":"")+(i+1);
  var thumbs=(c.more||[]).map(function(m,k){return '<button type="button" data-c="'+i+'" data-k="'+(k+1)+'" aria-label="Открыть скриншот"><img loading="lazy" src="'+src(m)+'" alt=""></button>'}).join("");
  return '<article class="case">'+
    '<div class="c-info"><div class="c-num">'+num+'</div><h3>'+esc(c.title)+'</h3>'+
    (c.meta?'<div class="c-meta">'+esc(c.meta)+'</div>':'')+
    (c.description?'<p class="c-desc">'+esc(c.description)+'</p>':'')+
    (c.tags&&c.tags.length?'<div class="c-tags">'+c.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div>':'')+
    '<div class="c-cols">'+
      (c.task&&c.task.length?'<div class="c-col"><h4>Задача</h4><ul>'+list(c.task)+'</ul></div>':'')+
      (c.result&&c.result.length?'<div class="c-col"><h4>Что получилось</h4><ul>'+list(c.result)+'</ul></div>':'')+
    '</div>'+
    '<div class="c-links">'+(c.url?'<a class="btn btn-main btn-sm" href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">Открыть сайт ↗</a>':'')+
    '<a class="btn btn-line btn-sm" href="#contact">Хочу такой же</a></div></div>'+
    '<div class="shots"><div class="browser"><div class="bar"><i></i><i></i><i></i><span>'+esc(c.displayUrl||c.title)+'</span></div>'+
    '<button type="button" data-c="'+i+'" data-k="0" aria-label="Открыть скриншот"><img loading="lazy" src="'+src(c.cover)+'" alt="'+esc(c.title)+'"></button></div>'+
    (c.mobile?'<div class="phone"><button type="button" data-c="'+i+'" data-m="1" aria-label="Открыть мобильную версию"><img loading="lazy" src="'+src(c.mobile)+'" alt="Мобильная версия"></button></div>':'')+
    (thumbs?'<div class="thumbs">'+thumbs+'</div>':'')+
    '</div></article>';
}).join("");

/* services */
$("s-title").textContent=P.servicesTitle; $("s-lead").textContent=P.servicesLead; show("s-lead",!!P.servicesLead);
$("s-grid").innerHTML=(P.services||[]).map(function(s){
  return '<div class="card">'+(s.icon?'<div class="ic">'+esc(s.icon)+'</div>':'')+'<h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p>'+(s.price?'<div class="price">'+esc(s.price)+'</div>':'')+'</div>';
}).join("");
$("services").hidden=!(P.services||[]).length;

/* process */
$("p-title").textContent=P.processTitle;
$("p-steps").innerHTML=(P.process||[]).map(function(s){return '<div class="step"><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div>'}).join("");
$("process").hidden=!(P.process||[]).length;

/* about */
$("a-title").textContent=P.aboutTitle;
$("a-text").innerHTML=(P.about||[]).map(function(t){return '<p>'+esc(t)+'</p>'}).join("");
$("a-skills").innerHTML=(P.skills||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("");
var ini=(P.name||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join("").toUpperCase();
$("a-photo").innerHTML=P.photo?'<img src="'+esc(src(P.photo))+'" alt="'+esc(P.name)+'">':'<span class="ini">'+esc(ini)+'</span>';

/* contacts */
$("c-title").textContent=P.contactTitle; $("c-lead").textContent=P.contactLead; show("c-lead",!!P.contactLead);
$("c-cta").innerHTML=contactButtons();
var cl="";
if(P.phone)cl+='<a href="tel:'+esc(P.phone.replace(/[^\d+]/g,""))+'">'+esc(P.phone)+'</a>';
if(P.max)cl+='<a href="#" data-max="'+esc(P.max)+'">MAX: '+esc(P.phone||P.max)+'</a>';
if(P.email)cl+='<a href="mailto:'+esc(P.email)+'">'+esc(P.email)+'</a>';
if(P.telegram)cl+='<a href="'+tg(P.telegram)+'" target="_blank" rel="noopener noreferrer">@'+esc(String(P.telegram).replace(/^@/,""))+'</a>';
$("c-list").innerHTML=cl;
$("f-left").textContent="© "+new Date().getFullYear()+" "+P.name;
$("f-right").textContent=P.footerNote||"";

/* MAX: ссылки по номеру нет, поэтому копируем номер */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-max]");if(!b)return;e.preventDefault();
  var n=b.dataset.max,old=b.textContent;
  function done(){b.textContent="Номер скопирован — найдите в MAX";setTimeout(function(){b.textContent=old},2600)}
  try{navigator.clipboard.writeText(n).then(done,function(){prompt("Номер для MAX:",n)})}catch(err){prompt("Номер для MAX:",n)}
});

/* theme toggle */
var root=document.documentElement;
try{var st=localStorage.getItem("theme");if(st)root.setAttribute("data-theme",st)}catch(e){}
$("theme").onclick=function(){
  var dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  var next=dark?"light":"dark";root.setAttribute("data-theme",next);
  try{localStorage.setItem("theme",next)}catch(e){}
};

/* lightbox */
var lb=document.createElement("div");lb.className="lb";
lb.innerHTML='<button class="x" aria-label="Закрыть">×</button><button class="p" aria-label="Назад">‹</button><img alt=""><button class="n" aria-label="Вперёд">›</button>';
document.body.appendChild(lb);
var li=0,cur=[],lbi=lb.querySelector("img");
function openLb(list,i){cur=list;li=i;lbi.src=cur[li];lb.classList.add("on");lb.querySelector(".p").hidden=lb.querySelector(".n").hidden=list.length<2}
function step(d){li=(li+d+cur.length)%cur.length;lbi.src=cur[li]}
lb.querySelector(".x").onclick=function(){lb.classList.remove("on")};
lb.querySelector(".p").onclick=function(){step(-1)};
lb.querySelector(".n").onclick=function(){step(1)};
lb.addEventListener("click",function(e){if(e.target===lb)lb.classList.remove("on")});
document.addEventListener("keydown",function(e){if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
$("cases-list").addEventListener("click",function(e){
  var b=e.target.closest("button[data-c]");if(!b)return;
  var c=+b.dataset.c;
  if(b.dataset.m){openLb([src(CASES[c].mobile)],0)}else{openLb(gallery[c],+b.dataset.k)}
});
</script>
</body>
</html>
